# This is a Databricks asset bundle definition for gtfs_rt.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: gtfs_rt
  uuid: 0d5cfff8-19f4-42e4-b4d6-c5cf475ef51b

include:
  - resources/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
      # We explicitly specify /Workspace/Users/john.armstrong@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/john.armstrong@databricks.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: john.armstrong@databricks.com
        level: CAN_MANAGE
    run_as:
      user_name: john.armstrong@databricks.com
