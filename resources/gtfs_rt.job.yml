# The main job for gtfs_rt.
resources:
  jobs:
    gtfs_rt_job:
      name: gtfs_rt_job

      email_notifications:
        on_failure:
          - john.armstrong@databricks.com

      tasks:
        - task_key: trip_updates
          job_cluster_key: job_cluster
          notebook_task:
            notebook_path: ../src/gtfs_rt.ipynb
            base_parameters:
              url: https://realtime.hsl.fi/realtime/trip-updates/v2/hsl
              message_type: trip_updates
          libraries:
            - pypi:
                package: gtfs-realtime-bindings==1.0.0
        - task_key: vehicle_positions
          job_cluster_key: job_cluster
          notebook_task:
            notebook_path: ../src/gtfs_rt.ipynb
            base_parameters:
              url: https://realtime.hsl.fi/realtime/vehicle-positions/v2/hsl
              message_type: vehicle_positions
          libraries:
            - pypi:
                package: gtfs-realtime-bindings==1.0.0
        
      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            autoscale:
                min_workers: 1
                max_workers: 1
